site_name: Spark
site_description: Local-first AI coding agent and office workbench with auditable guardrails
repo_url: https://github.com/badhope/spark
repo_name: badhope/spark

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Features: FEATURES.md
  - Start:
      - Install: INSTALL.md
      - Configuration: CONFIG.md
      - Built-in dev kit: builtin-dev-kit.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - API: API.md
      - Observability: OBSERVABILITY.md
      - Model routing: model-routing.md
      - Task memory: git-memory.md
      - Evaluations: evals.md
      - English docs index: en/README.md
  - Protocols:
      - A2A: A2A.md
      - ACP / IDE: ACP.md
  - Enterprise:
      - Control plane: ENTERPRISE.md
      - PR review: PR_REVIEW.md
      - Workflow: WORKFLOW.md
      - Outbound relay: RELAY.md
      - Remote control: REMOTE.md
  - Operations:
      - Diagrams and secrets: diagrams-ops.md
  - Decisions:
      - Master plan: reviews/2026-10-17-master-plan.md
      - Audit and direction: reviews/2026-10-17-audit-and-direction.md
      - Session digest: reviews/2026-10-17-session-digest.md
      - Competitive comparison: competitive-comparison.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
