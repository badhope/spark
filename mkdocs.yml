site_name: Spark
site_description: Browser-native, cross-platform, open-source AI coding application with auditable guardrails
repo_url: https://github.com/badhope/spark
repo_name: badhope/spark

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Product:
      - Project baseline: PROJECT_BASELINE.md
      - Positioning: PRODUCT_POSITIONING.md
      - Industry research: INDUSTRY_RESEARCH_2026-11-24.md
      - Autopilot: AUTOPILOT.md
      - Symbol graph: SYMBOL_GRAPH.md
      - OpenCode compatibility: OPENCODE_COMPAT.md
      - Core capability gaps: CORE_CAPABILITY_GAPS.md
      - Integration map: INTEGRATION_MAP.md
      - Competitive comparison: competitive-comparison.md
  - Features: FEATURES.md
  - Start:
      - Install: INSTALL.md
      - Configuration: CONFIG.md
      - Built-in dev kit: builtin-dev-kit.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Browser surface: BROWSER.md
      - Extension bridge: BROWSER_EXTENSION_BRIDGE.md
      - API: API.md
      - Observability: OBSERVABILITY.md
      - Model routing: model-routing.md
      - Task memory: git-memory.md
      - Evaluations: evals.md
      - English docs index: en/README.md
  - Protocols:
      - A2A: A2A.md
      - ACP / IDE: ACP.md
  - Enterprise:
      - Control plane: ENTERPRISE.md
      - PR review: PR_REVIEW.md
      - Workflow: WORKFLOW.md
      - Outbound relay: RELAY.md
      - Remote control: REMOTE.md
  - Operations:
      - Diagrams and secrets: diagrams-ops.md
  - Decisions:
      - Master plan: reviews/2026-10-17-master-plan.md
      - Audit and direction: reviews/2026-10-17-audit-and-direction.md
      - Session digest: reviews/2026-10-17-session-digest.md
      - Code audit 2026-11-24: reviews/2026-11-24-code-audit.md
      - Autopilot stress 2026-11-24: reviews/2026-11-24-autopilot-stress.md
      - Autopilot local model 2026-11-24: reviews/2026-11-24-autopilot-local-model.md
      - Autopilot recovery 2026-11-24: reviews/2026-11-24-autopilot-recovery.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
