# P1-9: 安全闭环 — secret 扫描 + 依赖漏洞扫描
# 独立 workflow，不改动现有 ci.yml / release.yml。
# * secret-scan：gitleaks + trufflehog，命中真实密钥即失败（阻断合并）。
# * dependency-audit：uv audit + pip-audit。只豁免已登记且上游无修复版本的
#   ChromaDB 嵌入式客户端告警；其余漏洞会阻断合并，迫使升级或显式登记。
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # trufflehog git 扫描需要完整历史
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Secret scan (gitleaks)
        run: pre-commit run gitleaks --all-files
      - name: Secret scan (trufflehog)
        # Use the released binary instead of pre-commit's Go build. Building
        # trufflehog from source inside the runner is vulnerable to transient
        # Go module download failures (stream errors from proxy.golang.org),
        # which look like a security failure but are not a finding.
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog git file://. --only-verified --fail --no-update

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install project
        run: pip install -e ".[dev]"
      - name: uv audit
        # ChromaDB 只以嵌入式 PersistentClient/EphemeralClient 使用，不启动 HTTP 服务；
        # 这 4 个 advisory 在 1.5.9 无修复版本，登记到上游发布修复为止。
        run: |
          uv audit --locked \
            --ignore-until-fixed PYSEC-2026-311 \
            --ignore-until-fixed PYSEC-2026-3813 \
            --ignore-until-fixed PYSEC-2026-3814 \
            --ignore-until-fixed PYSEC-2026-3815
      - name: pip-audit
        # 同一组 ChromaDB advisory；一旦上游发布修复版本，请删除对应 ignore 并升级。
        run: |
          pip install pip-audit
          python3 -m pip_audit --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
