name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # 先构建三平台产物（各自上传为 workflow artifact，不碰 Release）
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            setup: |
              pip install -e ".[dev,enterprise,office,platform,asr,pty]" pyinstaller pywebview "psycopg[binary]"
              pyinstaller --clean -y spark.spec
              pyinstaller --clean -y spark-desktop.spec
            pack: powershell Compress-Archive -Path dist/spark,dist/spark-desktop -DestinationPath spark-windows-x86_64.zip
            artifact: spark-windows-x86_64
            files: spark-windows-x86_64.zip
          - os: ubuntu-22.04   # GLIBC 2.35：兼容绝大多数发行版
            setup: |
              pip install -e ".[dev,enterprise,office,platform,asr,pty]" pyinstaller
              pyinstaller --clean -y spark.spec
            pack: tar -czf spark-linux-x86_64.tar.gz -C dist spark
            artifact: spark-linux-x86_64
            files: spark-linux-x86_64.tar.gz
          # macos-13 在免费额度下会长期排队（永不执行）；macos-latest 为 Apple Silicon
          - os: macos-latest
            setup: |
              pip install -e ".[dev,enterprise,office,platform,asr,pty]" pyinstaller
              pyinstaller --clean -y spark.spec
            pack: tar -czf spark-macos-arm64.tar.gz -C dist spark
            artifact: spark-macos-arm64
            files: spark-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        # 测试矩阵由 CI 负责；Release 只做可重复构建、打包与启动冒烟，
        # 避免跨平台浏览器测试的抖动阻塞制品发布。
        run: ${{ matrix.setup }}
      - name: Pack
        run: ${{ matrix.pack }}
      - name: Smoke test the bundle (must actually start)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dist/spark/spark.exe ]; then BIN=dist/spark/spark.exe
          elif [ -f dist/spark/spark ]; then BIN=dist/spark/spark
          else echo "no executable produced"; exit 1; fi
          "$BIN" --version | tee /tmp/spark-version.txt
          grep -qE '[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?' /tmp/spark-version.txt
      - name: Upload logs (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.artifact }}
          path: |
            build/spark/warn-spark.txt
            build/spark/xref-spark.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # 再由单一 job 汇总上传到 Release：避免多 job 并发写同一 release
  # （GitHub 的 immutable release 规则：一旦 release 发布，资产就无法再上传）
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the release tag
        id: tag
        # `workflow_dispatch` has no tag context, so a manual run used to die at
        # the upload step with "GitHub Releases requires a tag" after three
        # successful builds. Derive it from the package version instead, which
        # is the same number `spark --version` reports.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(python -c "import re,pathlib; print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SBOM
        run: |
          pip install -e .
          spark sbom -o dist-assets/spark-sbom.json
      - name: Generate SHA256SUMS
        run: |
          cd dist-assets
          sha256sum spark-windows-x86_64.zip spark-linux-x86_64.tar.gz spark-macos-arm64.tar.gz spark-sbom.json > SHA256SUMS
          cat SHA256SUMS
      - name: Verify release assets
        run: python scripts/check_release_assets.py dist-assets
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist-assets/*"
      - name: List assets
        run: ls -la dist-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist-assets/*
          generate_release_notes: true
          # `overwrite_files` 只在同一 tag 的草稿/新 release 上工作；对已经发布
          # 且 immutable 的 release，GitHub 会拒绝追加资产（422）。发布前请确认
          # 目标 tag 尚未存在，或先删除旧 release。
          draft: false
          prerelease: false

  # 文档站点与安装脚本可用性在 tag 后由 docs.yml / CI 保证；
  # 这里只做发布资产，不做 PyPI（publish.yml 独立负责）。
