name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    # Only the canonical repo may auto-merge. Mirror repos (X33834 /
    # Morningstar202604) are write-only copies; letting their Dependabot
    # merge locally makes them diverge from badhope/spark.
    if: >
      github.repository == 'badhope/spark' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # CI can take ~15 minutes on Windows; leave enough room to wait for it.
    timeout-minutes: 45
    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major version bumps are deliberately left for manual review. An
      # unconditional `gh pr merge --auto` merged agent-client-protocol
      # 0.12 -> 1.0 before its CI had finished, which broke ACP tests on
      # main because upstream removed acp.helpers.
      - name: Leave major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update detected; not auto-merging."

      - name: Wait for all PR checks to pass
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr checks "$PR_URL" --watch --fail-fast

      - name: Squash merge after green checks
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
