# Dependabot 显式接管：只做根目录 uv.lock 的每周例行更新。
# 动态推断曾错误探测 "/api for unstructured" 并持续报红（无此目录/包不适用）。
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      # 这两份清单在 v0.9.6 前已从仓库删除，但 GitHub 依赖图不会自动回收；
      # Dependabot 仍会动态扫描并生成 "uv in /api ..." 失败任务。显式排除。
      - "api/**"
      - "data-agent/**"
    ignore:
      - dependency-name: "unstructured"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
