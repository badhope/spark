[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-agent"
version = "0.13.1"
description = "Spark [Ember] — local-first coding agent with a Codex-style loop"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "agent", "coding", "local-first", "llm", "chatbot"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "agent-client-protocol>=0.12,<0.13",
    "chromadb>=1.0",
    "instructor>=1.4,<2.0",
    "litellm>=1.0,<2.0",
    "llama-index-core>=0.12,<1.0",
    "llama-index-llms-openai-like>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.0.10,<2.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0",
    # 上游（langgraph-checkpoint-sqlite 2.0.x）依赖 aiosqlite Connection 的
    # Thread.is_alive()；aiosqlite 0.22 移除了该 API——显式锁住兼容窗。
    "aiosqlite>=0.20,<0.23",
    "croniter>=7.0,<8.0",
    "mcp>=1.0,<2.0; python_version>=\"3.10\"",
    "nbformat>=5.10,<6.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "textual>=0.80,<1.0",
    "tomlkit>=0.13,<1.0",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.7",
        "import-linter>=2.0",
    "mypy>=1.11",
    "bandit>=1.7",
    "pre-commit>=3.6",
    "playwright>=1.49",
]
# OpenAPI 合同层（GET /api/openapi.json）。FastAPI 只用于声明 schema，不接管
# 运行时；未安装时该端点返回 503 并给出安装指引。
openapi = [
    "fastapi>=0.110",
]
# 企业平台会直接使用的 Web/运行时基础库。它们多数已通过 langgraph/llama-index
# 传递安装；显式列入可避免上游依赖调整时版本悄悄漂移。
platform = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "sse-starlette>=3.5",
    "tiktoken>=0.14",
    "tenacity>=9.2",
    "SQLAlchemy>=2.1",
    "pathspec>=1.1",
    "wcmatch>=12.0",
    "psutil>=7.2",
]
# 企业控制面（FastAPI /api/v1 + SQLAlchemy/Alembic + Authlib/Keycloak + Casbin）
enterprise = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "SQLAlchemy>=2.1",
    "alembic>=1.14",
    "authlib>=1.9",
    "casbin>=1.43",
    "pyjwt>=2.10",
    "python-multipart>=0.0.9",
]
# PostgreSQL 驱动（企业部署；本地 SQLite 不需要）
postgres = [
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
]
# 办公成果物与文档导入（docx/pdf/xlsx/pptx）
office = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=5.0",
    "pypdfium2>=4.0",
    "rapidocr-onnxruntime>=1.4",
    "extract-msg>=0.58",
    "reportlab>=4.0",
]
# Notebook 执行（读取/编辑已由 nbformat 承担；执行 cell 需要 nbclient）
notebook = [
    "nbclient>=0.11,<1.0",
]
# 网页搜索/正文抽取（未安装时回退到内置 Bing/HTMLParser）
search = [
    "ddgs>=9.16",
    "trafilatura>=2.3",
]
# P0-9: 观测（Langfuse 自托管 = OTLP 端点，spark 直接接入 OTLP 即可）
telemetry = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
]
# P1-5: 内置终端（真实 PTY）。Windows 走 pywinpty（ConPTY），Linux/macOS 走
# ptyprocess；未安装时 spark.pty 可导入但 PtyManager() 给出清晰报错。
pty = [
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "pywinpty>=3.1; sys_platform == 'win32'",
]
desktop = [
    "pywebview>=5.0",
]

[project.scripts]
spark = "spark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spark = ["prompts/*.md", "web/*.html", "web/dist/*", "web/dist/assets/*", "evals/data/*.json", "control/policies/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Dump every thread's stack if a single test exceeds 10 min. The plain suite
# takes ~2.5 min, so this only fires on a genuine deadlock and turns "CI hung
# with no output" into a stack trace naming the culprit.
faulthandler_timeout = 600
# Keep the ordering deterministic so a failure is reproducible.
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle import errors
    "E7",    # pycodestyle statement errors
    "E9",    # pycodestyle runtime errors
    "F",     # pyflakes
    "I001",  # import sorting
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# search.py deliberately defers pydantic/spark imports to avoid a circular
# import at module load time.
"src/spark/tools/search.py" = ["E402"]
# 以下文件中 logger = logging.getLogger(__name__) 紧跟在 __future__ 与 stdlib
# 导入之后、第三方/本地导入之前，避免 E402 噪音。
"src/spark/core/graph.py" = ["E402"]
"src/spark/memory/service.py" = ["E402"]
"src/spark/tools/shell.py" = ["E402"]
"src/spark/tui/app.py" = ["E402"]
# routes.py 保持 import-light：pty 写路径在 _POST_HANDLERS 定义后就近懒加载，
# 不为 import 排序把 pty 依赖提到模块顶部。
"src/spark/web/routes.py" = ["E402", "I001"]
# Standalone scripts must sys.path-insert the source tree before importing
# spark, so their imports legitimately follow executable code.
"scripts/*.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "llama_index.*",
    "langgraph.*",
    "litellm.*",
    "textual.*",
    "typer.*",
]
ignore_missing_imports = true
follow_imports = "skip"
