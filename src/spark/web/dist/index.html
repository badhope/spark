<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f4" />
    <meta name="description" content="Spark — 本地自托管的 AI 编程智能体：代码在你手，密钥在你手。" />
    <script>
      // 防 FOUC：首帧即应用正确主题。
      // 默认亮色（与 theme.ts 的 DEFAULT_THEME 一致）：只有用户显式选过
      // dark/system 才跟随，未选择时不再替用户假设"跟随系统"。
      try {
        var t = localStorage.getItem("spark-theme") || "light";
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
      // 配色同样在首帧应用，否则会先闪一帧默认色再跳到用户选择。
      try {
        document.documentElement.setAttribute(
          "data-palette",
          localStorage.getItem("spark-palette") || "ember"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-palette", "ember");
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
